services:
  postgres:
    image: postgres:16-alpine
    container_name: digital_mushaf_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mushaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mushaf_dev}
      POSTGRES_DB: ${POSTGRES_DB:-digital_mushaf}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mushaf} -d ${POSTGRES_DB:-digital_mushaf}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
